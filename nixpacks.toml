[phases.setup]
nixPkgs = ["python311", "nodejs_20", "npm"]

[phases.install]
cmds = [
  "pip install --no-cache-dir -r requirements.txt",
  "cd frontend && npm install --no-audit --no-fund"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cp -r frontend/dist/* backend/frontend_dist/ 2>/dev/null || true",
  "mkdir -p backend/frontend_dist && cp -r frontend/dist/* backend/frontend_dist/"
]

[start]
cmd = "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
